services:
  - type: web
    name: gofundus-api
    runtime: python
    plan: free
    rootDir: gofundus/backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate && python manage.py seed_ghana_demo_institutions && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /api/institutions/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
